<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Your campus space for real friends, private chats, games, and voice calls." />
    <meta name="application-name" content="Student Addit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Student Addit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/adda-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/adda-192.png" />
    <title>Student Addit — your campus community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const retryKey = 'adda-asset-retry-at';
        const showLoadError = () => {
          const render = () => {
            document.body.innerHTML = '<main style="max-width:32rem;margin:15vh auto;padding:2rem;font:16px system-ui;color:#30312e"><h1 style="font-size:1.5rem">Adda could not finish loading</h1><p>Please check your connection and try again.</p><button id="adda-reload" style="padding:.7rem 1rem;border:0;background:#e75c3c;color:white;font:inherit;cursor:pointer">Reload adda</button></main>';
            document.getElementById('adda-reload')?.addEventListener('click', () => location.reload());
          };
          if (document.body) render();
          else document.addEventListener('DOMContentLoaded', render, { once: true });
        };

        window.addEventListener('error', (event) => {
          const target = event.target;
          const failedScript = target instanceof HTMLScriptElement && (target.type === 'module' || target.src.includes('/assets/'));
          const failedStyle = target instanceof HTMLLinkElement && (target.relList.contains('stylesheet') || target.relList.contains('modulepreload'));
          if (!failedScript && !failedStyle) return;

          let previousAttempt;
          try {
            previousAttempt = Number(sessionStorage.getItem(retryKey) || 0);
            if (previousAttempt && Date.now() - previousAttempt < 30_000) {
              showLoadError();
              return;
            }
            sessionStorage.setItem(retryKey, String(Date.now()));
          } catch {
            showLoadError();
            return;
          }
          location.reload();
        }, true);

        window.addEventListener('adda:app-ready', () => {
          window.setTimeout(() => {
            try { sessionStorage.removeItem(retryKey); } catch { /* Storage may be disabled. */ }
          }, 30_000);
        }, { once: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
