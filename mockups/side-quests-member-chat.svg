  <text x="274" y="127" class="mono" font-size="10" letter-spacing="1.2" fill="#8d8e84">01  /  THE MAIN ROOM</text>
  <text x="274" y="180" class="display" font-size="42" font-weight="600" letter-spacing="-2" fill="#232726">Come say <tspan class="serif" font-style="italic" font-weight="400" fill="#d95b3e">something.</tspan></text>
  <text x="274" y="208" class="sans" font-size="14" fill="#83857b">A room full of people, and all the time in the world.</text>
