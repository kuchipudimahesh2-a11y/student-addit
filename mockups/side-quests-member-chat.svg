  <rect x="274" y="240" width="676" height="65" fill="#fbfaf6"/><line x1="274" y1="305" x2="950" y2="305" stroke="#e4e1d6"/>
  <circle cx="307" cy="272" r="17" fill="#edede5"/><text x="307" y="279" text-anchor="middle" class="display" font-size="18" fill="#747969">#</text><text x="336" y="270" class="sans" font-size="13" font-weight="700" fill="#343832">the-adda</text><text x="336" y="288" class="mono" font-size="9" fill="#a1a197">one room, all of us</text><circle cx="850" cy="273" r="4" fill="#7a9f78"/><text x="861" y="277" class="mono" font-size="9" fill="#82847b">LIVE</text><text x="916" y="277" class="sans" font-size="16" fill="#81837b">⟳</text>
  <circle cx="306" cy="345" r="15" fill="#dce3dc"/><text x="306" y="350" text-anchor="middle" class="serif" font-size="12" fill="#597063">✳</text><text x="331" y="342" class="mono" font-size="9" fill="#61665e">MEMBER <tspan fill="#b3b1a7"> ·  2 MIN AGO</tspan></text><rect x="331" y="351" width="309" height="43" rx="10" fill="#f1efe6"/><text x="344" y="378" class="sans" font-size="12" fill="#4e524c">I think my plant is judging my life choices.</text>
  <circle cx="899" cy="420" r="15" fill="#e5c4ad"/><text x="899" y="425" text-anchor="middle" class="serif" font-size="12" fill="#854d3b">Y</text><text x="825" y="415" class="mono" font-size="9" fill="#61665e">YOU <tspan fill="#b3b1a7"> ·  JUST NOW</tspan></text><rect x="596" y="424" width="262" height="43" rx="10" fill="#e8e4d8"/><text x="610" y="451" class="sans" font-size="12" fill="#4e524c">Tell it your plans. Let it worry.</text>
  <circle cx="306" cy="512" r="15" fill="#eee0cf"/><text x="306" y="517" text-anchor="middle" class="serif" font-size="12" fill="#95693c">✳</text><text x="331" y="509" class="mono" font-size="9" fill="#61665e">MEMBER <tspan fill="#b3b1a7"> ·  JUST NOW</tspan></text><rect x="331" y="518" width="347" height="43" rx="10" fill="#f1efe6"/><text x="344" y="545" class="sans" font-size="12" fill="#4e524c">The plant already has a tiny LinkedIn profile.</text>
  <rect x="289" y="594" width="646" height="55" fill="#f1efe6" stroke="#ebe8dd"/><text x="307" y="627" class="sans" font-size="12" fill="#aaa99f">Say something nice...</text><rect x="888" y="604" width="34" height="34" rx="2" fill="#d95b3e"/><path d="M899 615l13-4-4 13-3-5-6-4z" fill="none" stroke="#fff" stroke-width="1.5"/>
  <rect x="970" y="240" width="300" height="190" fill="#f7f5ef" stroke="#e4e1d6"/><text x="989" y="270" class="mono" font-size="9" letter-spacing="1" fill="#7e8177">♧  PEOPLE AROUND</text><rect x="1227" y="255" width="27" height="20" rx="9" fill="#e9e6dc"/><text x="1240" y="269" text-anchor="middle" class="mono" font-size="8" fill="#61655d">18</text><circle cx="1004" cy="307" r="12" fill="#e4d8c9"/><text x="1004" y="311" text-anchor="middle" class="serif" font-size="10" fill="#936b50">✳</text><text x="1024" y="310" class="mono" font-size="9" fill="#65695f">Community members</text><line x1="989" y1="335" x2="1251" y2="335" stroke="#e4e1d6"/><text x="989" y="356" class="sans" font-size="10" fill="#9d9c91">Member names and adda IDs stay private</text><text x="989" y="371" class="sans" font-size="10" fill="#9d9c91">in the room.</text>
  <rect x="970" y="444" width="300" height="226" fill="#e7e6d8"/><circle cx="1004" cy="480" r="17" fill="#f4f2e7"/><text x="1004" y="486" text-anchor="middle" class="serif" font-size="19" fill="#77816a">◉</text><text x="989" y="517" class="mono" font-size="9" letter-spacing="1" fill="#7c8073">FEELING CURIOUS?</text><text x="989" y="552" class="display" font-size="22" font-weight="600" fill="#343832">Meet a stranger.</text><text x="989" y="578" class="serif" font-size="21" font-style="italic" fill="#788469">Leave as friends.</text><text x="989" y="643" class="mono" font-size="9" letter-spacing=".7" fill="#62695a">TRY RANDOM CHAT  ↗</text>
