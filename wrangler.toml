name = "student-addit"
main = "worker/index.ts"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "student-addit-db"
database_id = "643bf700-550c-4005-809a-d8ec00d41e67"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "RANDOM_POOL"
class_name = "RandomPool"

[[durable_objects.bindings]]
name = "STUDIES_FEED"
class_name = "StudiesFeed"

[[r2_buckets]]
binding = "STUDIES_BUCKET"
bucket_name = "student-addit-studies"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom", "RandomPool"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["StudiesFeed"]

[observability]
enabled = true
