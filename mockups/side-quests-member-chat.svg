  <text x="318" y="855" class="mono" font-size="8" letter-spacing=".7" fill="#9c8d74">QUEST 01</text><circle cx="713" cy="851" r="3" fill="#89a17e"/><text x="724" y="855" class="mono" font-size="8" fill="#829275">LIVE</text>
  <text x="318" y="890" class="display" font-size="18" font-weight="600" fill="#42463e">Invent a holiday no one asked</text><text x="318" y="914" class="display" font-size="18" font-weight="600" fill="#42463e">for. What are we celebrating?</text>
