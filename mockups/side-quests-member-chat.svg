  <line x1="331" y1="971" x2="723" y2="971" stroke="#e9e6dc"/><circle cx="345" cy="994" r="11" fill="#e6d9c9"/><text x="345" y="998" text-anchor="middle" class="serif" font-size="10" fill="#936b50">✳</text><text x="364" y="992" class="mono" font-size="7" fill="#9b9c90">MEMBER · JUST NOW</text><text x="364" y="1011" class="sans" font-size="11" fill="#555a51">National Nap-First Decision-Making Day.</text><text x="364" y="1027" class="sans" font-size="11" fill="#555a51">The agenda can wait until after lunch.</text>
  <line x1="331" y1="1042" x2="723" y2="1042" stroke="#e9e6dc"/><circle cx="345" cy="1066" r="11" fill="#e5c4ad"/><text x="345" y="1070" text-anchor="middle" class="serif" font-size="10" fill="#854d3b">Y</text><text x="364" y="1064" class="mono" font-size="7" fill="#9b9c90">YOU · JUST NOW</text><text x="364" y="1083" class="sans" font-size="11" fill="#555a51">International Sock Drawer Reorganization</text><text x="364" y="1099" class="sans" font-size="11" fill="#555a51">Day. Mismatched socks get immunity.</text>
  <rect x="318" y="1211" width="418" height="100" fill="#f5f3ed" stroke="#e9e6dc"/><text x="332" y="1234" class="sans" font-size="10" fill="#99998d">Add your answer to the wall...</text><line x1="330" y1="1260" x2="724" y2="1260" stroke="#e5e1d5"/><text x="332" y="1284" class="mono" font-size="7" letter-spacing=".4" fill="#aaa99d">ONE ANSWER PER PERSON</text><rect x="637" y="1270" width="86" height="28" fill="#d95b3e"/><text x="680" y="1288" text-anchor="middle" class="sans" font-size="9" fill="#fff">Add mine  ↗</text>
  <rect x="772" y="825" width="458" height="580" fill="#fbfaf6" stroke="#e5e1d5"/>
  <text x="792" y="855" class="mono" font-size="8" letter-spacing=".7" fill="#9c8d74">QUEST 02</text><circle cx="1187" cy="851" r="3" fill="#89a17e"/><text x="1198" y="855" class="mono" font-size="8" fill="#829275">LIVE</text>
  <text x="792" y="890" class="display" font-size="18" font-weight="600" fill="#42463e">What would your totally useless</text><text x="792" y="914" class="display" font-size="18" font-weight="600" fill="#42463e">superpower be?</text>
  <rect x="792" y="934" width="418" height="264" fill="#f5f3ed" stroke="#eeece4"/><text x="807" y="958" class="mono" font-size="8" letter-spacing=".7" fill="#a09f93">THE ANSWER WALL</text><circle cx="1192" cy="952" r="10" fill="#e8e5d9"/><text x="1192" y="956" text-anchor="middle" class="mono" font-size="8" fill="#73776b">2</text>
  <line x1="805" y1="971" x2="1197" y2="971" stroke="#e9e6dc"/><circle cx="819" cy="994" r="11" fill="#dce3dc"/><text x="819" y="998" text-anchor="middle" class="serif" font-size="10" fill="#597063">✳</text><text x="838" y="992" class="mono" font-size="7" fill="#9b9c90">MEMBER · JUST NOW</text><text x="838" y="1011" class="sans" font-size="11" fill="#555a51">I make every queue move 3% faster.</text><text x="838" y="1027" class="sans" font-size="11" fill="#555a51">Unless I'm standing in it.</text>
  <line x1="805" y1="1042" x2="1197" y2="1042" stroke="#e9e6dc"/><circle cx="819" cy="1066" r="11" fill="#eee0cf"/><text x="819" y="1070" text-anchor="middle" class="serif" font-size="10" fill="#95693c">✳</text><text x="838" y="1064" class="mono" font-size="7" fill="#9b9c90">MEMBER · JUST NOW</text><text x="838" y="1083" class="sans" font-size="11" fill="#555a51">When I sneeze, a nearby pigeon nods.</text>
  <rect x="792" y="1211" width="418" height="100" fill="#f5f3ed" stroke="#e9e6dc"/><text x="806" y="1234" class="sans" font-size="10" fill="#99998d">Add your answer to the wall...</text><line x1="804" y1="1260" x2="1198" y2="1260" stroke="#e5e1d5"/><text x="806" y="1284" class="mono" font-size="7" letter-spacing=".4" fill="#aaa99d">ONE ANSWER PER PERSON</text><rect x="1111" y="1270" width="86" height="28" fill="#d95b3e"/><text x="1154" y="1288" text-anchor="middle" class="sans" font-size="9" fill="#fff">Add mine  ↗</text>
  <text x="274" y="1467" class="mono" font-size="8" letter-spacing=".8" fill="#aaa99d">YOUR ADDA IS WAITING</text><text x="1270" y="1467" text-anchor="end" class="mono" font-size="8" letter-spacing=".8" fill="#aaa99d">AN OPEN ROOM FOR OPEN MINDS  →</text>
  <rect x="1334" y="30" width="235" height="175" fill="#e9ebe1"/><text x="1351" y="58" class="mono" font-size="8" letter-spacing=".8" fill="#868b7e">WEDNESDAY  ·  OCTOBER 07</text><text x="1351" y="104" class="display" font-size="25" fill="#272c29">A good day</text><text x="1351" y="132" class="display" font-size="25" fill="#272c29">to say <tspan class="serif" font-style="italic" fill="#7e8a70">hello.</tspan></text><circle cx="1357" cy="174" r="3" fill="#7a9f78"/><text x="1368" y="178" class="sans" font-size="9" fill="#82877a">your people are one message away</text>
  <g transform="rotate(-1 1450 365)"><rect x="1339" y="250" width="218" height="200" fill="#f0e6d8"/><text x="1357" y="279" class="mono" font-size="8" letter-spacing=".8" fill="#a17b63">A LITTLE REMINDER</text><text x="1357" y="330" class="serif" font-size="20" fill="#625649">Be kind. Stay</text><text x="1357" y="356" class="serif" font-size="20" fill="#625649">curious. Keep it</text><text x="1357" y="382" class="serif" font-size="20" font-style="italic" fill="#d95b3e">adda.</text><line x1="1357" y1="414" x2="1538" y2="414" stroke="#d8c4ae" stroke-dasharray="3 4"/></g>
